[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "synapse-health"
version = "0.1.0"
description = "S.Y.N.A.P.S.E. — evaluación de datos sanitarios sintéticos: validez inferencial (bioestadística) y riesgo de reidentificación (ataques de privacidad)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Maricel Meneses Gómez" },
  { name = "Yoandy Ramírez Delgado" },
]
keywords = ["synthetic data", "survival analysis", "privacy", "membership inference", "GDPR", "EHDS", "biostatistics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lifelines>=0.29",
  "scikit-survival>=0.23",
  "anonymeter>=1.0",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "pyarrow>=15",
]

[project.optional-dependencies]
dash = ["streamlit>=1.36"]
deep = ["synthcity>=0.2.11", "opacus<1.5.4"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "nbmake>=1.5",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6.29",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
]

[project.scripts]
synapse = "synapse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: pruebas largas (estudio completo)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:.*keyword-only.*"]

[tool.coverage.run]
source = ["synapse"]
omit = ["*/synapse/generators/deep.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/synapse"]
exclude = ["src/synapse/generators/deep.py"]
